<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f6; --card:#fff; --ink:#1d2a30; --muted:#6b7a82; --line:#e3e8eb;
  --pri:#0f766e; --pri-soft:#e0f2ef; --inc:#15803d; --exp:#c2410c; --warn:#dc2626; --over:#ea580c;
  --r:14px;
}
/* Section colours */
.s-acc{--c:#0f766e;--cs:#e6f4f1}
.s-bud{--c:#d97706;--cs:#fdf3e1}
.s-res{--c:#7c3aed;--cs:#f1ecfe}
.s-goal{--c:#2563eb;--cs:#e6eefc}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(243,245,246,.86),rgba(243,245,246,.93)),var(--bgimg,url(bg.svg)) center/cover no-repeat}
.hero{position:relative;margin-bottom:12px;border-radius:18px;overflow:hidden;min-height:150px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45)),var(--bgimg,url(bg.svg)) center 60%/cover no-repeat;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.hero .hi{font-size:13px;opacity:.95}
.hero .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.hero .sub{font-size:12.5px;opacity:.95}
#sync{font-size:12px;white-space:nowrap}
.banner{font-size:12px;text-align:center;padding:6px 10px}
.banner.off{background:#fef3c7;color:#92400e} .banner.loc{background:#e0f2fe;color:#075985}
.bgprev{height:90px;border-radius:12px;background:var(--bgimg,url(bg.svg)) center/cover;margin-bottom:8px}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
header h1{font-size:17px;margin:0;flex:1;font-weight:600}
header button{background:rgba(255,255,255,.15);border:0;border-radius:10px;color:#fff;padding:6px 10px;cursor:pointer}
main{padding:12px 12px 100px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:4px 8px;cursor:pointer;min-width:58px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--pri);font-weight:600}
nav .plus{background:var(--pri);color:#fff;border-radius:50%;width:54px;height:54px;min-width:54px;font-size:28px;margin-top:-26px;box-shadow:0 4px 12px rgba(15,118,110,.35);justify-content:center}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 2px 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.sec{color:var(--c)}
h2.sec::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
h2 .tot{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink);font-size:13px}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.pos{color:var(--inc)} .neg{color:var(--warn)}
/* Tiles (3 columns) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 18%,transparent);border-radius:13px;padding:9px 9px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-height:104px;position:relative}
.tile .e{font-size:20px;line-height:1}
.tile .n{font-size:12px;line-height:1.2;margin-top:5px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.tile .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile.acc{min-height:78px}
.tile .badge{position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;background:#fff;color:var(--c)}
.tile .badge.bad{background:var(--warn);color:#fff}
.tile .badge.ok{background:var(--inc);color:#fff}
/* Progress bar with today's tick */
.pb{position:relative;height:7px;background:rgba(0,0,0,.08);border-radius:5px;margin-top:6px}
.pb>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c);max-width:100%}
.pb>i.ok{background:#16a34a}
.pb>i.over{background:var(--over)} .pb>i.bad{background:var(--warn)} .pb>i.done{background:var(--inc)}
.pb>b{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);border-radius:1px;transform:translateX(-1px)}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 2px 0}
.legend2 span{display:flex;align-items:center;gap:4px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px}
.total{display:flex;justify-content:space-between;padding:6px 4px 0;font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--muted);margin-left:4px;vertical-align:middle}
.chip.ok{background:#dcfce7;color:var(--inc)} .chip.res{background:#ede9fe;color:#7c3aed} .chip.exp{background:#fee2e2;color:var(--warn)}
.prompt{background:var(--pri-soft);border:1px solid #b7e2db}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:var(--line);color:var(--ink)}
.btn.ghost{background:none;color:var(--pri);padding:6px 8px}
.btn.danger{background:#fee2e2;color:var(--warn)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%;padding:13px}
.btn:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{background:var(--cs,#fff);border:1px solid color-mix(in srgb,var(--c,#ccc) 25%,transparent);border-left:5px solid var(--c,#ccc);border-radius:var(--r);padding:14px 12px;text-align:left;cursor:pointer}
.action .ic{font-size:24px} .action b{display:block;margin-top:6px;color:var(--c,inherit)} .action span{font-size:12px;color:var(--muted)}
.a-exp{--c:#dc2626;--cs:#fdeeee} .a-inc{--c:#16a34a;--cs:#e9f7ee} .a-sal{--c:#0f766e;--cs:#e6f4f1} .a-sav{--c:#2563eb;--cs:#e6eefc}
.a-tr{--c:#d97706;--cs:#fdf3e1} .a-st{--c:#0891b2;--cs:#e2f4f8} .a-mv{--c:#7c3aed;--cs:#f1ecfe}
/* goal colour blocks */
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gtile{--cs:color-mix(in srgb,var(--c) 10%,#fff);background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-top:5px solid var(--c);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.gtile .top2{display:flex;align-items:center;gap:6px}
.gtile .e{font-size:22px}
.gtile .n{font-weight:700;color:var(--c);font-size:14px;line-height:1.2}
.gtile .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.gtile .s{font-size:12px;color:var(--muted)}
.gtile .pb>i{background:var(--c)}
.gtile .btns{display:flex;gap:6px;margin-top:8px}
.gtile .btns button{flex:1;border:0;border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;background:#fff;color:var(--c);cursor:pointer}
.gtile .btns button:disabled{opacity:.4}
/* history day columns */
.hnav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.hnav .grow{flex:1;text-align:center;font-weight:600;font-size:14px}
.hcols{display:grid;gap:6px;align-items:start}
.hday{background:#e9eef0;border-radius:12px;padding:6px;min-height:120px}
.hday.today{background:var(--pri-soft)}
.hday .hd{text-align:center;font-size:12px;font-weight:700;padding:2px 0 6px}
.hday .hd small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.hent{background:#fff;border-radius:9px;padding:6px 7px;margin-bottom:6px;border-left:4px solid var(--c,#94a3b8);font-size:11.5px;line-height:1.25}
.hent .l{font-weight:600;word-break:break-word}
.hent .a{font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.hent .d{color:var(--muted);font-size:10.5px;margin-top:2px;word-break:break-word}
.hent summary{cursor:pointer;color:var(--pri)}
.hent .x{border:0;background:none;color:var(--muted);font-size:10.5px;padding:2px 0 0;cursor:pointer}
.hent .x.danger{color:var(--warn);font-weight:700}
.hempty{text-align:center;color:var(--muted);font-size:11px;padding:10px 0}
.k-exp{--c:#d97706} .k-sav{--c:#2563eb} .k-inc{--c:#16a34a} .k-tr{--c:#64748b} .k-mv{--c:#7c3aed}
/* funds, settings blocks, wallet sheet */
.fundcard{--cs:color-mix(in srgb,var(--c) 9%,#fff);background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);border-left:5px solid var(--c);border-radius:14px;padding:12px;margin-bottom:8px}
.fundcard .t1{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--c)}
.fundcard .t1 .amt{margin-left:auto;color:var(--ink);font-size:18px}
.fundcard .held{font-size:12px;color:var(--muted);margin:4px 0 8px}
.fundcard .row button{flex:1}
.s-fund{--cs:color-mix(in srgb,var(--c) 10%,#fff)}
.ftag{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:8px;padding:0 6px;margin-right:4px;vertical-align:1px}
.tile .fs{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fundpick button{border-color:color-mix(in srgb,var(--fc) 40%,transparent)} .fundpick button.on{background:var(--fc);border-color:var(--fc)}
.sset h2.sec{color:var(--c)} .sset h2.sec::before{background:var(--c)}
.sset>.card{border-left:4px solid var(--c)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.item{background:color-mix(in srgb,var(--c) 8%,#fff);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);border-top:4px solid var(--c);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px}
.item.off{opacity:.55}
.item input,.item select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;width:100%;font-size:13px;min-width:0}
.item .r{display:flex;gap:5px} .item input.emo{width:44px;flex:none;text-align:center;font-size:17px;padding:3px}
.item .lb{font-size:11px;color:var(--muted);margin-bottom:-3px}
.item label.ck{font-size:12px;display:flex;gap:5px;align-items:center} .item label.ck input{width:auto}
.item .acts{display:flex;gap:5px;margin-top:2px} .item .acts button{flex:1;padding:6px 4px;font-size:12px}
.additem{border:2px dashed color-mix(in srgb,var(--c) 40%,transparent);background:none;border-radius:12px;color:var(--c);font-weight:700;min-height:80px;cursor:pointer}
.whist .wr{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.whist .wr:last-child{border-bottom:0}
.whist .wr .grow{min-width:0} .whist .wr .d{color:var(--muted);font-size:11.5px}
.adv{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.gcard{border-left:4px solid var(--c)}
/* bottom sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
#sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 0}
#sheet .top{display:flex;align-items:center;margin-bottom:8px}
#sheet .top h3{flex:1;margin:0;font-size:17px}
.sheetEnd{height:calc(14px + env(safe-area-inset-bottom))}
.f{margin-bottom:10px}
.f label,.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px}
.f input,.f select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* wallet picker */
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:7px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:5px}
.pick button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
/* category picker in the expense form */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
.cats button{border:1px solid color-mix(in srgb,var(--c) 22%,transparent);background:var(--cs);border-radius:12px;padding:8px 4px;min-height:64px;cursor:pointer;font-size:11.5px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px}
.cats button .e{font-size:20px}
.cats button small{color:var(--muted);font-size:10px}
.cats-h{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--c);margin:8px 2px 4px}
/* calculator */
.cdisp{background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:10px;text-align:right;border:1.5px solid var(--line)}
.cdisp .clab{text-align:left;font-size:12px;color:var(--muted)}
.cexpr{min-height:18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;word-break:break-all}
.cval{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.keys{position:sticky;bottom:0;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));margin-top:6px}
.keys button{border:0;background:#fff;border-radius:12px;height:46px;font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.keys button.op{background:#e8eef0;color:var(--pri)}
.keys button.eq{background:var(--pri);color:#fff;grid-row:span 2;height:auto}
.keys button.cl{color:var(--warn)}
.keys button:active{transform:scale(.97)}
.line{display:flex;align-items:center;gap:8px;padding:6px 0}
.line .lab{flex:1;min-width:0;font-size:14px}
.line input{width:130px;text-align:right;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;font-variant-numeric:tabular-nums}
.line select{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px;background:#fff;min-width:0}
.sum{display:flex;justify-content:space-between;padding:8px 2px;font-weight:600;border-top:1px solid var(--line);margin-top:6px}
.step{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.wizlab{text-align:center;font-size:20px;font-weight:600;margin:4px 0 10px}
.check{display:flex;align-items:center;gap:8px;margin:8px 2px}
.check input{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2a30;color:#fff;border-radius:12px;padding:10px 14px;z-index:30;display:none;align-items:center;gap:12px;font-size:14px;max-width:92%}
#toast button{background:none;border:0;color:#5eead4;font-weight:600;cursor:pointer}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.hbar .l{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{flex:1;background:var(--line);height:10px;border-radius:6px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--exp)}
.hbar .v{width:30%;text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:8px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols .pair{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.cols .pair i{width:40%;max-width:18px;border-radius:4px 4px 0 0;display:block}
.cols small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.ed{display:grid;grid-template-columns:56px 1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ed input,.ed select{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;width:100%}
.ed .full{grid-column:1/-1} .ed .w2{grid-column:span 2}
.ed input.emo{text-align:center;font-size:18px;padding:4px}
.ed label.ck{display:flex;align-items:center;gap:6px;font-size:13px}
.ed label.ck input{width:auto}
.edS{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.edS input{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;width:100%}
.err{color:var(--warn);font-size:13px;margin:6px 2px}
.center{text-align:center;padding:40px 10px;color:var(--muted)}
.demo{background:#fef3c7;color:#92400e;font-size:12px;text-align:center;padding:6px}
@media (min-width:600px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} .cats{grid-template-columns:repeat(6,minmax(0,1fr))} }
</style>
</head>
<body>
<header>
  <button id="backBtn" onclick="history.back()" aria-label="Back" style="display:none;font-size:18px;padding:4px 10px">←</button>
  <h1 id="title">Budget</h1>
  <button id="sync" onclick="go('settings');setTimeout(()=>{const e=document.getElementById('syncBox');if(e)e.scrollIntoView({block:'center'})},50)">☁</button>
  <button id="langBtn" onclick="toggleLang()">FR</button>
  <button onclick="go('settings')" aria-label="Settings">⚙︎</button>
</header>
<div id="banner"></div>
<main id="view"><div class="center">…</div></main>
<nav>
  <button data-v="home" onclick="go('home')"><span class="ic">⌂</span><span data-t="home"></span></button>
  <button data-v="goals" onclick="go('goals')"><span class="ic">◎</span><span data-t="goals"></span></button>
  <button class="plus" onclick="openAdd()" aria-label="Add">+</button>
  <button data-v="reports" onclick="go('reports')"><span class="ic">▤</span><span data-t="reports"></span></button>
  <button data-v="history" onclick="go('history')"><span class="ic">☰</span><span data-t="history"></span></button>
</nav>
<div id="ov" onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
/* =====================================================================
   1. TEXTS (French / English)
   ===================================================================== */
const TX = {
 fr:{home:'Accueil',goals:'Objectifs',reports:'Rapports',history:'Journal',settings:'Réglages',

/** Upgrades older data: v2 = emojis, targets, default amounts, household wallet; v3 = Urgency/Health become normal goals. */
function migrate(){
  const S=D.settings, ver=+S.version||1;
  if(ver>=V) return null;
  if(ver<2){
    D.accounts.forEach(a=>{ if(!a.emoji) a.emoji=EMO[a.id]||'👛'; if(a.id==='household'&&!a.spend) a.spend='food'; });
    D.categories.forEach(c=>{ if(!c.emoji) c.emoji=EMO[c.id]||'🏷️'; });
    D.goals.forEach(g=>{ if(!g.emoji) g.emoji=EMO[g.id]||'🎯'; if(TARGETS_V2[g.id]) g.target=TARGETS_V2[g.id];
      if(g.id==='vacation'){ g.name_fr='Vacances de janvier'; g.name_en='January vacation'; } });
    (S.salaries||[]).forEach(s=>(s.lines||[]).forEach(l=>{ if(LINES_V2[l.env]!=null) l.amount=LINES_V2[l.env]; }));
    S.irregular=Object.assign({threshold:200000,savingsPct:70,personal:['aroo','ohanna','cece'],account:'bank'},S.irregular||{},{remainderGoal:'land'});
  }
  if(ver<6){
    S.missions=S.missions||{};
    funds().filter(f=>f.cats).forEach(f=>{ if(!S.missions[f.id]) startMission(f.id,true); });
    call('apiSetSetting','missions',S.missions);
  }
  if(ver<5){
    S.funds=S.funds||FUNDS_DEF; S.savingMode=S.savingMode||'equal';
    fundAccounts().forEach(a=>{ if(!D.accounts.some(x=>x.id===a.id)) D.accounts.push(a); });
    fwCategories(30).forEach(c=>{ if(!D.categories.some(x=>x.id===c.id)) D.categories.push(c); });
    S.fundIncome=S.fundIncome||{fieldwork:{lines:FW_CATS.map(c=>({env:'c:'+c[0],amount:0}))}};
    call('apiSetSetting','funds',S.funds); call('apiSetSetting','savingMode',S.savingMode); call('apiSetSetting','fundIncome',S.fundIncome);
  }
  if(ver<4){
    const add=(id,fr,en,o)=>{ if(!D.accounts.some(a=>a.id===id)) D.accounts.push({id,name_fr:fr,name_en:en,opening:0,active:true,order:o,emoji:EMO[id],spend:'',savings:true}); };
    add('savbank','Épargne – Banque','Savings – Bank',6); add('savcash','Épargne – Espèces','Savings – Cash',7);
    S.savAccount=S.savAccount||'savbank'; call('apiSetSetting','savAccount',S.savAccount);
  }
  if(ver<3){
    D.goals.forEach(g=>{ if(g.id==='urgency'||g.id==='health'){ g.kind='goal'; g.target=TARGETS_V2[g.id]; g.deadline=''; } });
    S.rollover={sources:[],targets:[]};
  }
  S.version=V;
  call('apiBulkUpsert','Accounts',D.accounts); call('apiBulkUpsert','Categories',D.categories); call('apiBulkUpsert','Goals',D.goals);
  call('apiSetSetting','salaries',S.salaries); call('apiSetSetting','irregular',S.irregular); call('apiSetSetting','rollover',S.rollover);
  call('apiSetSetting','version',V);
  return true;
}

 * Offline-first: all data lives on this device (localStorage) and the screen updates at once.
 * When a Google Sheet is connected, every change is queued ("outbox") and sent to the Sheet
 * as soon as there is a connection. On opening, the app sends pending changes, then reloads
 * the Sheet's data (the Sheet is the reference when several devices are used).
 */
const LS_DATA='bt_data', LS_OUT='bt_outbox', LS_CONN='bt_conn';
let CONN=null, OUTBOX=[];
try{ CONN=JSON.parse(lsGet(LS_CONN)||'null'); OUTBOX=JSON.parse(lsGet(LS_OUT)||'[]'); }catch(e){}
const SYNC={busy:false,last:lsGet('bt_lastSync')||'',err:''};
function saveCache(){ if(D) lsSet(LS_DATA,JSON.stringify(D)); }
function remote(fn,args){
  return fetch(CONN.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CONN.token,fn,args})})
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'Error'); return j.result; });
}
/** Every change goes through here: saved on the device, then queued for the Sheet. */
function call(fn,...args){
  saveCache();
  if(CONN){ OUTBOX.push({id:uid(),fn,args:JSON.parse(JSON.stringify(args))}); lsSet(LS_OUT,JSON.stringify(OUTBOX)); flush(); }
  else updSync();
  return Promise.resolve(true);
}
async function flush(){
  if(!CONN||SYNC.busy){ updSync(); return; }
  if(!OUTBOX.length){ updSync(); return; }
  SYNC.busy=true; updSync();
  let dup=false;
  try{
    while(OUTBOX.length){
      const op=OUTBOX[0];
      try{ await remote(op.fn,op.args); }
      catch(e){ const m=String(e.message||e);
        if(m.includes('DUPLICATE')){ dup=true; }         // already recorded on the Sheet: drop it
        else if(m==='AUTH'){ SYNC.err=t('authErr'); throw e; }
        else throw e; }
      OUTBOX.shift(); lsSet(LS_OUT,JSON.stringify(OUTBOX));
    }
    SYNC.err=''; SYNC.last=new Date().toISOString(); lsSet('bt_lastSync',SYNC.last);
  }catch(e){ if(!SYNC.err) SYNC.err=navigator.onLine?String(e.message||e):''; }
  finally{ SYNC.busy=false; updSync(); }
  if(dup){ toast(t('dup')); pull(); }
}
/** Sends pending changes, then reloads everything from the Sheet. */
async function pull(){
  if(!CONN||!navigator.onLine) { updSync(); return; }
  await flush(); if(OUTBOX.length) return;
  SYNC.busy=true; updSync();
  try{
    const d=await remote('apiGetAll',[]);
    if(d.empty){ // empty Sheet: send what is on this device
      await remote('apiInit',[{Accounts:D.accounts,Categories:D.categories,Goals:D.goals,Settings:D.settings}]);
      if(D.ledger.length) await remote('apiAppend',[D.ledger]);
    } else { D=normalise(d); afterLoad(); saveCache(); render(); }
    SYNC.err=''; SYNC.last=new Date().toISOString(); lsSet('bt_lastSync',SYNC.last);
  }catch(e){ SYNC.err=String(e.message||e)==='AUTH'?t('authErr'):(navigator.onLine?String(e.message||e):''); }
  finally{ SYNC.busy=false; updSync(); }
}
function updSync(){
  const el=document.getElementById('sync'); if(!el) return;
  const n=OUTBOX.length;
  el.textContent=!CONN?'📱':SYNC.busy?'⏳':!navigator.onLine?'📴'+(n?' '+n:''):SYNC.err?'⚠️':n?'⏳ '+n:'☁✓';
  el.title=!CONN?t('localOnly'):SYNC.err||(n?n+' '+t('pending'):t('synced'));
  const b=document.getElementById('banner');
  if(b) b.innerHTML=CONN&&!navigator.onLine?`<div class="banner off">📴 ${t('offlineMsg')}</div>`:(!CONN&&!lsGet('bt_hideLocal')?`<div class="banner loc">📱 ${t('localMsg')} <a href="#" onclick="lsSet('bt_hideLocal','1');updSync();return false">✕</a></div>`:'');
  const sb=document.getElementById('syncState'); if(sb) sb.innerHTML=syncStateHtml();
}
window.addEventListener('online',()=>{ updSync(); pull(); });
window.addEventListener('offline',updSync);

let D = null, VIEW = 'home';
let lastAcc = lsGet('bt_lastAcc') || 'cash';

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthOf(d){ return String(d).slice(0,7); }
function nextMonth(m){ let [y,mo]=m.split('-').map(Number); mo++; if(mo>12){mo=1;y++;} return y+'-'+String(mo).padStart(2,'0'); }
function prevMonth(m){ let [y,mo]=m.split('-').map(Number); mo--; if(mo<1){mo=12;y--;} return y+'-'+String(mo).padStart(2,'0'); }
function lastDay(m){ const [y,mo]=m.split('-').map(Number); return m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0'); }
function monthLabel(m){ const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString(LANG==='en'?'en-GB':'fr-FR',{month:'short',year:'2-digit'}); }
function dateLabel(d){ if(!d) return ''; const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString(LANG==='en'?'en-GB':'fr-FR',{day:'numeric',month:'short',year:'numeric'}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function isTrue(v){ return v===true || v==='TRUE' || v==='true' || v===1; }
function num(v){ return +String(v==null?'':v).replace(/[^\d.-]/g,'')||0; }
function sp(n){ return Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function fmt(n){ n=Math.round(+n||0); return (n<0?'−':'')+sp(n)+' Ar'; }
function fmtK(n){ n=Math.round(+n||0); const a=Math.abs(n); const s=a>=1e6?(a/1e6).toFixed(a%1e6?1:0).replace('.',',')+' M':a>=1e4?Math.round(a/1e3)+' k':sp(a); return (n<0?'−':'')+s; }
function fmtIn(n){ n=Math.round(+n||0); return n? sp(n) : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nm(o){ if(!o) return '?'; return LANG==='en' ? (o.name_en||o.name_fr) : (o.name_fr||o.name_en); }
function em(o){ return (o&&o.emoji)||''; }
function byOrder(a,b){ return (+a.order||0)-(+b.order||0); }
function acts(list){ return list.filter(x=>isTrue(x.active)).sort(byOrder); }
function wallets(){ return acts(D.accounts).filter(a=>!a.spend&&!isTrue(a.savings)&&!a.fund); }   // personal everyday wallets
function savWallets(){ return acts(D.accounts).filter(a=>isTrue(a.savings)&&!a.fund); }           // where savings are physically kept
function fundWallets(f){ return f?acts(D.accounts).filter(a=>!a.spend&&(!a.fund||a.fund===f)):wallets(); } // shared + the fund's own wallets
function funds(){ return D.settings.funds||[]; }
function fundObj(f){ return funds().find(x=>x.id===f); }
function fundName(f){ const o=fundObj(f); return f&&o?(em(o)+' '+nm(o)).trim():'👤 '+t('personal'); }
function fundColor(f){ const o=fundObj(f); return o&&o.color||'#0f766e'; }
function rf(r){ return r.fund||''; }
function cats(fund){ return acts(D.categories).filter(c=>(c.fund||'')===(fund||'')); }
function envFund(e){ const o=envObj(e); return e&&e.startsWith('c:')&&o?(o.fund||''):''; }
function envLabel(e,fund){ return e?envName(e):(fund?fundName(fund):t('toAssign')); }
function isSav(id){ const a=D.accounts.find(x=>x.id===id); return !!a&&isTrue(a.savings); }
function defSav(){ const s=D.settings.savAccount; return savWallets().some(a=>a.id===s)?s:((savWallets()[0]||{}).id||''); }
function savPick(id,sel,label){ const L=savWallets(); if(!L.length) return ''; return `<div class="lbl">${label||t('savWallet')}</div>`+walletPick(id,sel||defSav(),L); }
function accName(id){ const a=D.accounts.find(x=>x.id===id); return a?(em(a)+' '+nm(a)).trim():'?'; }
function envObj(e){ if(!e) return null; const [k,id]=e.split(':'); return (k==='c'?D.categories:D.goals).find(x=>x.id===id); }
function envName(e){ if(!e) return t('toAssign'); const o=envObj(e); return o?(em(o)+' '+nm(o)).trim():'?'; }

/** Account and envelope balances, optionally as of a date (inclusive). */
/** Balances of one fund ('' = personal). Shared wallets can hold money of several funds. */
function balances(asOf,fund){
  fund=fund||''; const acc={}, env={};
  D.accounts.forEach(a=>{ acc[a.id]=(a.fund||'')===fund?num(a.opening):0; });
  const add=(o,k,v)=>{ if(k) o[k]=(o[k]||0)+v; };
  for(const r of D.ledger){
    if(asOf && r.date>asOf) continue;
    if(rf(r)!==fund) continue;
    const a=num(r.amount);
    if(r.type==='income'){ add(acc,r.acc,a); add(env,r.env,a); }
    else if(r.type==='expense'){ add(acc,r.acc,-a); add(env,r.env,-a); }
    else if(r.type==='transfer'){ add(acc,r.acc,-a); add(acc,r.acc2,a); }
    else if(r.type==='move'){ add(env,r.env,-a); add(env,r.env2,a); }
    else if(r.type==='adjust'){ add(acc,r.acc,a); add(env,r.env,a); }
    else if(r.type==='budget'){ add(env,r.env,a); }                      // budget set for a category (a plan, not money)   // wallet correction (amount can be negative)
  }
  const totAcc=Object.values(acc).reduce((s,v)=>s+v,0);
  const totEnv=Object.values(env).reduce((s,v)=>s+v,0);
  return {acc,env,pool:totAcc-totEnv,totAcc};
}
function spentInMonth(m,fund){ const s={}; D.ledger.forEach(r=>{ if(r.type==='expense'&&rf(r)===(fund||'')&&monthOf(r.date)===m) s[r.env]=(s[r.env]||0)+r.amount; }); return s; }
function periodStart(fund){
  if(fund){ const m=(D.settings.missions||{})[fund]; return (m&&m.start)||'0000-00-00'; }
  const sal=D.ledger.filter(r=>r.ref&&r.ref.startsWith('sal-')&&!rf(r));
  if(!sal.length) return monthOf(today())+'-01';
  const lastM=sal.map(r=>r.ref.slice(-7)).sort().pop();
  return sal.filter(r=>r.ref.endsWith(lastM)).map(r=>r.date).sort()[0];
}
function spentSince(start,fund){ const s={}; D.ledger.forEach(r=>{ if(r.type==='expense'&&rf(r)===(fund||'')&&r.date>=start) s[r.env]=(s[r.env]||0)+r.amount; }); return s; }
/** Field work: a new mission resets every category to its planned budget. */
function startMission(fund,silent){
  const S=D.settings, plan=((S.fundIncome||{})[fund]||{}).lines||[], date=today(), grp=uid(), ref='mission-'+fund+'-'+uid();
  const FB=balances(null,fund), rows=[];
  cats(fund).forEach(c=>{ const b=Math.round(FB.env['c:'+c.id]||0); if(b) rows.push(row({type:'budget',amount:-b,env:'c:'+c.id,date,grp,ref,fund,note:t('resetNote')})); });
  plan.forEach(l=>{ if(num(l.amount)>0) rows.push(row({type:'budget',amount:num(l.amount),env:l.env,date,grp,ref,fund,note:t('newMission')})); });
  S.missions=S.missions||{}; S.missions[fund]={start:date};
  call('apiSetSetting','missions',S.missions);
  if(silent){ D.ledger.push(...rows); if(rows.length) call('apiAppend',rows); } else commit(rows,t('newMission'));
}
function askMission(btn,fund){ if(!btn.dataset.sure){ btn.dataset.sure='1'; btn.textContent=t('sureMission'); return; } startMission(fund); }

/** Equal parts taken back from the goals that hold money (used when a savings wallet is adjusted down). */
function equalDraw(amount){
  const env=balances().env;
  const items=acts(D.goals).map(g=>({env:'g:'+g.id,bal:Math.max(0,Math.round(env['g:'+g.id]||0)),amt:0})).filter(i=>i.bal>0);
  let left=amount;
  while(left>0){
    const open=items.filter(i=>i.bal-i.amt>0); if(!open.length) break;
    const part=Math.floor(left/open.length/100)*100;
    if(part===0){ const tg=open.find(i=>i.env==='g:land')||open.sort((a,b)=>(b.bal-b.amt)-(a.bal-a.amt))[0]; const x=Math.min(left,tg.bal-tg.amt); tg.amt+=x; left-=x; continue; }
    open.forEach(i=>{ const x=Math.min(part,i.bal-i.amt,left); i.amt+=x; left-=x; });
  }
  const out=items.filter(i=>i.amt>0).map(i=>({env:i.env,amount:i.amt}));
  if(left>0) out.push({env:'',amount:left});
  return out;
}

function effDeadline(g,date){
  if(!g.deadline) return '';
  let d=String(g.deadline);
  if(isTrue(g.yearly)) while(d<date) d=(+d.slice(0,4)+1)+d.slice(4);
  return d;
}
function goalOpen(g,bal,date){
  if(!isTrue(g.active) || g.kind!=='goal') return false;
  const tg=num(g.target);
  if(tg>0 && bal>=tg) return false;
  const dl=effDeadline(g,date);
  return !(dl && dl<date);
}
function monthsLeft(dl,date){ return Math.max(1,(new Date(dl+'T00:00:00')-new Date(date+'T00:00:00'))/86400000/30.44); }

/** Proportional split rounded to 100 Ar; rounding difference goes to the largest line. */
function split(amount,items){
  const tot=items.reduce((s,i)=>s+i.w,0);
  if(!items.length||tot<=0) return [];
  const out=items.map(i=>({env:i.env,amount:Math.round(amount*i.w/tot/100)*100}));
  const diff=amount-out.reduce((s,o)=>s+o.amount,0);
  if(diff){ out.sort((a,b)=>b.amount-a.amount)[0].amount+=diff; }
  return out.filter(o=>o.amount!==0);
}

/** Splits across open goals by need: (target − saved) ÷ months left. Used by "Saving" and the rollover fallback. */
function byNeed(amount,date,envBal){
  const open=D.goals.filter(g=>goalOpen(g,envBal['g:'+g.id]||0,date));
  if(!open.length) return amount?[{env:'',amount}]:[];
  const withT=open.filter(g=>num(g.target)>0);
  if(!withT.length) return split(amount,open.map(g=>({env:'g:'+g.id,w:1})));
  let items=withT.map(g=>{ const rem=num(g.target)-(envBal['g:'+g.id]||0); const dl=effDeadline(g,date);
    return {env:'g:'+g.id,rem,need:rem/(dl?monthsLeft(dl,date):12),amt:0}; });
  let left=amount, act=items.slice();
  while(left>0.5 && act.length){
    const tot=act.reduce((s,i)=>s+i.need,0);
    const full=act.filter(i=>i.amt+left*i.need/tot>=i.rem);
    if(!full.length){ act.forEach(i=>i.amt+=left*i.need/tot); left=0; break; }
    full.forEach(i=>{ left-=(i.rem-i.amt); i.amt=i.rem; });
    act=act.filter(i=>!full.includes(i));
  }
  const out=items.filter(i=>i.amt>0).map(i=>({env:i.env,amount:Math.floor(i.amt/100)*100}));
  let rest=amount-out.reduce((s,o)=>s+o.amount,0);
  if(left<=0.5 && out.length){ out.slice().sort((a,b)=>b.amount-a.amount)[0].amount+=rest; rest=0; }
  if(rest>0) out.push({env:'',amount:rest});
  return out.filter(o=>o.amount>0);
}

/**
 * Irregular income rule:
 *  ≤ threshold → shared in equal parts between all open goals (not yet reached, deadline not passed)
 *  > threshold → savingsPct % shared equally between those goals, the rest equally between the personal categories
 *  Rounding remainders (parts are rounded down to 100 Ar) go to the remainder goal (Land).
 */
function irregularSplit(amount,date){
  const R=D.settings.irregular||{}, env=balances().env;
  const goals=D.goals.filter(g=>goalOpen(g,env['g:'+g.id]||0,date)).sort(byOrder).map(g=>'g:'+g.id);
  const out={};
  const add=(k,v)=>{ out[k]=(out[k]||0)+v; };
  const equal=(total,keys)=>{ if(!keys.length) return total; const part=Math.floor(total/keys.length/100)*100; keys.forEach(k=>add(k,part)); return total-part*keys.length; };
  let rest;
  if(amount<=num(R.threshold)) rest=equal(amount,goals);
  else {
    const sav=Math.round(amount*num(R.savingsPct)/100);
    rest=equal(sav,goals)+equal(amount-sav,(R.personal||[]).map(id=>'c:'+id));
  }
  if(rest>0){
    const remKey='g:'+(R.remainderGoal||'land');
    add(goals.includes(remKey)?remKey:(goals[0]||''),rest);
  }
  return Object.entries(out).filter(([,v])=>v>0).map(([env,amount])=>({env,amount}));
}

/** End-of-month rollover rows not yet made (only if a rollover rule is set in Settings; none by default). */
function buildRollovers(){
  const rs=D.settings.rollover, start=D.settings.startMonth;
  if(!rs||!start) return [];
  const cur=monthOf(today()); const created=[];
  for(let m=start; m<cur; m=nextMonth(m)){
    const ref='roll-'+m;
    if(D.ledger.some(r=>r.ref===ref)) continue;
    const date=lastDay(m), grp=uid();
    for(const src of rs.sources||[]){
      const b=balances(date).env;
      const amt=Math.round(b['g:'+src]||0);
      if(amt<=0) continue;
      const parts=split(amt,(rs.targets||[]).map((tg,i)=>({env:String(i),w:num(tg.pct)})));
      const dests=[];
      parts.forEach(p=>{
        const tg=rs.targets[+p.env];
        const cand=[tg.goal,tg.fallback].filter(Boolean).map(id=>D.goals.find(g=>g.id===id)).filter(Boolean);
        const ok=cand.find(g=>goalOpen(g,b['g:'+g.id]||0,date));
        if(ok) dests.push({env:'g:'+ok.id,amount:p.amount});
        else byNeed(p.amount,date,b).forEach(x=>dests.push(x));
      });
      dests.forEach(d=>{
        const r=row({date,type:'move',amount:d.amount,env:'g:'+src,env2:d.env,grp,ref,created:new Date().toISOString()});
        D.ledger.push(r); created.push(r);
      });
    }
  }
  return created;
}

function setView(html){ document.getElementById('view').innerHTML=html; }
function load(){
  let cached=null;
  try{ cached=JSON.parse(lsGet(LS_DATA)||'null'); }catch(e){}
  if(!cached){ // first launch on this device (or data from the earlier demo version)
    let old=null; try{ old=JSON.parse(lsGet('bt_demo')||'null'); }catch(e){}
    const src=old&&old.Settings&&Object.keys(old.Settings).length?old:makeDefaults();
    cached={accounts:src.Accounts,categories:src.Categories,goals:src.Goals,ledger:src.Ledger||[],settings:src.Settings};
  }
  D=normalise(cached); afterLoad(); saveCache(); render(); updSync();
  if(CONN) pull();
}
function afterLoad(){
  migrate();
  const roll=buildRollovers();
  if(roll.length){ call('apiAppend',roll); toast(t('rolloverDone')); }
}
function normalise(d){
  d.ledger=(d.ledger||[]).map(r=>Object.assign(r,{amount:num(r.amount),date:String(r.date).slice(0,10)}));
  d.settings=d.settings||{};
  return d;
}
function reload(){ return pull(); }
function commit(rows,msg){
  D.ledger.push(...rows);
  closeSheet(); render();
  call('apiAppend',rows);
  const g=rows[0]&&rows[0].grp;
  toast(msg||t('saved'), g?()=>deleteGroup(g):null);
}
function deleteGroup(g){
  D.ledger=D.ledger.filter(r=>r.grp!==g); render();
  call('apiDeleteGroup',g); toast(t('deleted'));
}
function row(o){ return Object.assign({id:uid(),date:today(),type:'',amount:0,acc:'',acc2:'',env:'',env2:'',grp:'',ref:'',note:'',fund:''},o); }

/** Budget tile: progress of this month's spending, with a tick at today's pace (budget × day ÷ days in month). */
function budgetTile(key,o,B,spentM,cls,style,tick){
  const bal=B.env[key]||0, spent=spentM[key]||0, budget=bal+spent;
  if(tick==null) tick=0;
  const pct=budget>0?Math.min(100,spent/budget*100):(spent>0?100:0);
  let state=budget>0?'ok':'', badge='';
  if(bal<0){ state='bad'; badge=`<span class="badge bad">${t('overspent')}</span>`; }
  else if(budget>0 && tick && spent>budget*tick) state='over';
  return `<button class="tile ${cls}" ${style?`style="${style}"`:''} onclick="openExpense('${key}')">
    ${badge}<span class="e">${esc(em(o))}</span><span class="n">${esc(nm(o))}</span>
    <span class="v ${bal<0?'neg':''}">${fmt(bal)}</span>
    <span class="s">${fmtK(spent)} / ${fmtK(budget)}</span>
    <span class="pb"><i class="${state}" style="width:${pct}%"></i>${budget>0&&tick?`<b style="left:${tick*100}%"></b>`:''}</span></button>`;
}
function goalTile(g,B){
  const bal=B.env['g:'+g.id]||0, tg=num(g.target), pct=tg?Math.min(100,bal/tg*100):0, dl=effDeadline(g,today());
  const badge=tg&&bal>=tg?`<span class="badge ok">✓</span>`:'';

function groupInfo0(rs){

  if(r.type==='adjust') return {k:'k-tr',label:'🔧 '+t('adjustment')+' · '+accName(r.acc),amt:tot,cls:tot<0?'neg':'pos',lines:rs.length>1?rs.map(x=>envLabel(x.env,rf(x))+' '+fmt(x.amount)):[]};
  const arrow=x=>`${envName(x.env)} → ${envName(x.env2)} ${fmt(x.amount)}`;
  if(r.ref&&r.ref.startsWith('sal-')){ const s=(D.settings.salaries||[]).find(x=>x.id===r.ref.split('-')[1]);
    const inc=rs.filter(x=>x.type==='income');
    return {k:'k-inc',label:'💼 '+(s?nm(s):t('salary')),amt:inc.reduce((a,x)=>a+x.amount,0),cls:'pos',
      lines:rs.map(x=>x.type==='income'&&!x.env?'💳 → '+accName(x.acc)+' '+fmt(x.amount):envName(x.env)+' '+fmt(x.amount)+(x.type==='income'?' ('+accName(x.acc)+')':''))}; }
  if(r.ref&&r.ref.startsWith('mission-')) return {k:'k-mv',label:'🔄 '+t('newMission'),amt:rs.filter(x=>x.amount>0).reduce((a,x)=>a+x.amount,0),lines:rs.map(x=>envLabel(x.env,rf(x))+' '+fmt(x.amount))};
  if(rs.every(x=>x.type==='budget'||x.type==='move')&&rs.some(x=>x.type==='budget')) return {k:'k-mv',label:'📋 '+(r.ref&&r.ref.startsWith('left-')?t('leftTitle'):t('budgets')),amt:rs.reduce((a,x)=>a+(x.type==='budget'?x.amount:0),0),
      lines:rs.map(x=>x.type==='move'?`${envLabel(x.env,rf(x))} → ${envLabel(x.env2,rf(x))} ${fmt(x.amount)}`:envLabel(x.env,rf(x))+' '+fmt(x.amount))};
  if(r.ref&&r.ref.startsWith('roll-')) return {k:'k-mv',label:'🔁 '+t('rollover'),amt:tot,lines:rs.map(arrow)};
  const tr=rs.find(x=>x.type==='transfer'), trLines=rs.filter(x=>x.type==='transfer').map(x=>`${accName(x.acc)} → ${accName(x.acc2)} ${fmt(x.amount)}`);
  if(tr&&!rs.some(x=>x.type==='move'||x.type==='income')){ const fe=rs.find(x=>x.type==='expense');
    return {k:'k-tr',label:'⇄ '+accName(tr.acc)+' → '+accName(tr.acc2),amt:tr.amount,lines:fe?[t('fees')+' '+fmt(fe.amount)+' ('+envName(fe.env)+')']:[]}; }
  if(r.type==='expense'){ const sav=rs.every(x=>String(x.env).startsWith('g:'));
    return {k:sav?'k-sav':'k-exp',label:rs.map(x=>envLabel(x.env,rf(x))).join(', '),amt:-tot,cls:'neg',lines:rs.length>1?rs.map(x=>envName(x.env)+' '+fmt(x.amount)):[],acc:accName(r.acc)}; }
  if(r.type==='income') return {k:'k-inc',label:'💰 '+t('irregular'),amt:tot,cls:'pos',lines:rs.map(x=>envLabel(x.env,rf(x))+' '+fmt(x.amount)+(x.acc!==r.acc?' ('+accName(x.acc)+')':'')),acc:accName(r.acc)};
  // moves: savings transfer / reassign / saving
  const mv=rs.filter(x=>x.type==='move'); rs=mv.length?mv:rs;

  const fromSav=srcs.every(x=>String(x).startsWith('g:')), toSav=rs.every(x=>String(x.env2).startsWith('g:'));
  const label=(fromSav?'🔀 '+t('savTransfer'):toSav?'🎯 '+t('saving'):'↪ '+t('move'));
  return {k:'k-mv',label,amt:rs.reduce((a,x)=>a+x.amount,0),lines:rs.map(arrow).concat(trLines.map(x=>'💳 '+x))};
}

/* --- Calculator (one per form) --- */
let CALC={expr:'',on:null}, KEEPX=null;
function calcHtml(init,label){ CALC={expr:KEEPX!=null?KEEPX:(init?String(Math.round(init)):''),on:null}; KEEPX=null; setTimeout(calcShow,0);
  return `<div class="cdisp">${label?`<div class="clab">${label}</div>`:''}<div class="cexpr" id="cExpr"></div><div class="cval" id="cVal">0 Ar</div></div>`; }
function keypadHtml(id){
  const k=(v,c,extra)=>`<button type="button" class="${c||''}" ${extra||''} onclick="calcKey('${v}')">${v}</button>`;
  return `<div class="keys" id="${id||'kp'}">${k('C','op cl')}${k('÷','op')}${k('×','op')}${k('⌫','op')}
    ${k('7')}${k('8')}${k('9')}${k('−','op')}${k('4')}${k('5')}${k('6')}${k('+','op')}
    ${k('1')}${k('2')}${k('3')}${k('=','eq')}${k('00')}${k('0')}${k('000')}</div>`;
}
const OPS='+−×÷';
function calcKey(k){
  let e=CALC.expr;
  if(k==='C') e='';
  else if(k==='⌫') e=e.slice(0,-1);
  else if(k==='=') e=String(Math.max(0,calcEval(e))||'');
  else if(OPS.includes(k)){ if(!e) return; if(OPS.includes(e.slice(-1))) e=e.slice(0,-1); e+=k; }
  else { const lastNum=e.split(/[+−×÷]/).pop(); if(lastNum.length>=12) return; if(lastNum==='0') e=e.slice(0,-1); if(!lastNum&&k.startsWith('0')&&k!=='0') return; e+=k; }
  CALC.expr=e; calcShow();
}
function calcEval(e){
  e=String(e||'').replace(/[+−×÷]$/,''); if(!e) return 0;
  const tok=e.match(/\d+|[+−×÷]/g)||[];
  const st=[+tok[0]||0];
  for(let i=1;i<tok.length;i+=2){
    const op=tok[i], n=+tok[i+1]||0;
    if(op==='×') st.push(st.pop()*n); else if(op==='÷') st.push(n?st.pop()/n:0);
    else if(op==='+') st.push(n); else st.push(-n);
  }
  return Math.round(st.reduce((a,b)=>a+b,0));
}
function calcVal(){ return Math.max(0,calcEval(CALC.expr)); }
function calcShow(){
  if(!$('cVal')) return;
  const hasOp=/[+−×÷]/.test(CALC.expr);
  $('cExpr').textContent=hasOp?CALC.expr.replace(/\d+/g,d=>sp(+d)).replace(/([+−×÷])/g,' $1 '):'';
  $('cVal').textContent=fmt(calcVal());
  if(CALC.on) CALC.on();
}
document.addEventListener('keydown',e=>{
  if(!$('ov').classList.contains('open')) return;
  if(e.key==='Escape'){ closeSheet(); return; }
  if(!$('cVal') || ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  const map={'*':'×','x':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Delete':'C'};
  const k=/^\d$/.test(e.key)?e.key:map[e.key];
  if(k){ e.preventDefault(); calcKey(k); }
});

function equalGoals(amount,date){ // equal parts between open goals, remainder to the remainder goal (Land)
  const env=balances().env, R=D.settings.irregular||{};
  const goals=D.goals.filter(g=>goalOpen(g,env['g:'+g.id]||0,date)).sort(byOrder).map(g=>'g:'+g.id);
  if(!goals.length) return [{env:'',amount}];
  const part=Math.floor(amount/goals.length/100)*100, out=goals.map(k=>({env:k,amount:part}));
  const rest=amount-part*goals.length, rk='g:'+(R.remainderGoal||'land');
  if(rest>0) (out.find(o=>o.env===rk)||out[0]).amount+=rest;
  return out.filter(o=>o.amount>0);
}
/** Pairs sources and destinations into "move" rows (src → dst). */
function pairMoves(srcs,dsts,base){
  const rows=[], S=srcs.map(x=>({...x})), T=dsts.map(x=>({...x})); let i=0,j=0;
  while(i<S.length&&j<T.length){ const a=Math.min(S[i].amount,T[j].amount);
    if(a>0&&S[i].env!==T[j].env) rows.push(row(Object.assign({type:'move',amount:a,env:S[i].env,env2:T[j].env},base)));
    S[i].amount-=a; T[j].amount-=a; if(S[i].amount<=0) i++; if(T[j].amount<=0) j++; }
  return rows;
}

      (rest>0?`<div class="line"><span class="lab muted">${t('unassigned')}</span><span class="amt">${fmt(rest)}</span></div>`:'')+
      `<div class="sum"><span>${t('total')} · ${esc(accName(W.acc))}</span><span>${fmt(W.amount)}</span></div></div>
      ${rest<0?`<div class="err">${t('overAlloc')} (${fmt(-rest)})</div>`:''}
      <div class="two"><button class="btn sec" onclick="wizBack()">${t('back')}</button><button class="btn" ${rest<0?'disabled':''} onclick="wizSave()">${t('save')}</button></div>`;
  } else {
    const l=W.lines[st], used=W.lines.slice(0,st).reduce((s,x)=>s+x.amount,0);
    body=`<div class="step">${st+1} / ${n} · ${t('remaining')} ${fmt(W.amount-used)}</div><div class="wizlab">${esc(envName(l.env))}</div>`+calcHtml(l.amount)+
      `<div class="two"><button class="btn sec" onclick="wizBack()">${t('back')}</button><button class="btn" onclick="wizNext()">${t('confirm')} ✓</button></div>
      <button class="btn ghost block" style="margin-top:4px" onclick="CALC.expr='';wizNext()">${t('skip')}</button>`+keypadHtml();
  }
  sheet(`💼 ${esc(nm(W.s))} · ${st==='sum'?t('summary'):fmt(W.amount)}`,body);
}
function wizStore(){
  const st=W.seq[W.i];
  if(st==='head'){ W.amount=calcVal(); W.acc=pickVal('wAcc')||W.acc; W.sav=pickVal('wSav')||W.sav; W.month=$('wMonth').value||W.month; W.date=$('wDate').value||W.date; }
  else if(typeof st==='number'){ W.lines[st].amount=calcVal(); }
  else if(st==='left'&&pickVal('wLeftAcc')) W.leftAcc=pickVal('wLeftAcc');
}
function wizNext(){ wizStore(); if(W.seq[W.i]==='head'&&(!W.amount||!W.acc)){ if(!W.acc) $('wErr').textContent=t('pickWallet'); return; } W.i=Math.min(W.seq.length-1,W.i+1); wizRender(); }
function wizBack(){ wizStore(); W.i=Math.max(0,W.i-1); wizRender(); }
function wizSave(){
  const ref='sal-'+W.s.id+'-'+W.month;
  if(D.ledger.some(r=>r.ref===ref)){ toast(t('dup')); return; }
  const grp=uid();
  const rows=[], base={date:W.date,grp,ref,note:nm(W.s)};
  // 1. last month's budgets: reset, after moving what the user chose to keep/reallocate
  const lg=uid(), lb={date:W.date,grp:lg,ref:'left-'+W.month,note:t('leftNote')};
  if(W.left.length||W.neg.length){
    const src=W.left.filter(x=>x.on&&x.amount>0), tot=src.reduce((s,x)=>s+x.amount,0);
    if(tot>0&&W.leftMode==='goals'){
      const dst=W.leftNeed?byNeed(tot,W.date,balances().env):equalGoals(tot,W.date);
      rows.push(...pairMoves(src,dst,lb));
      const toGoals=dst.filter(d=>d.env.startsWith('g:')).reduce((s,d)=>s+d.amount,0);
      const from=W.leftAcc||W.acc;
      if(toGoals>0&&W.sav&&from!==W.sav) rows.push(row(Object.assign({type:'transfer',amount:toGoals,acc:from,acc2:W.sav},lb)));
    } else if(tot>0&&W.leftMode==='one'){
      rows.push(...pairMoves(src,[{env:W.leftEnv,amount:tot}],lb));
    } // 'keep': stays in the same budget and is added to this month's amount
    const reset=W.left.filter(x=>!x.on&&x.amount>0).concat(W.neg);   // not kept: back to 0 (the money stays in the wallets)
    reset.forEach(x=>rows.push(row(Object.assign({type:'budget',amount:-x.amount,env:x.env},lb,{note:t('resetNote')}))));
  }
  // 2. the salary: money into the wallet, savings part into the savings wallet + goals
  const sav=W.lines.filter(l=>l.amount>0&&l.env.startsWith('g:')), savTot=sav.reduce((s,l)=>s+l.amount,0);
  sav.forEach(l=>rows.push(row(Object.assign({type:'income',amount:l.amount,acc:W.sav||W.acc,env:l.env},base))));
  if(W.amount-savTot>0) rows.push(row(Object.assign({type:'income',amount:W.amount-savTot,acc:W.acc,env:''},base)));
  // 3. this month's budgets (a plan: not tied to any wallet)
  W.lines.filter(l=>l.amount>0&&l.env.startsWith('c:')).forEach(l=>rows.push(row(Object.assign({type:'budget',amount:l.amount,env:l.env},base))));
  rows.sort((a,b)=>(a.grp===grp?0:1)-(b.grp===grp?0:1));
  commit(rows);
}

  (S.salaries||[]).forEach((s,si)=>{
    const tot=(s.lines||[]).reduce((a,l)=>a+num(l.amount),0);
    sal+=`<div class="card" id="sal${si}"><div class="edS"><input value="${esc(s.name_fr)}" data-k="name_fr" placeholder="${t('nameFr')}"><input value="${esc(s.name_en)}" data-k="name_en" placeholder="${t('nameEn')}"></div>
      <div class="f" style="margin-top:8px"><label>${t('amount')}</label><input inputmode="numeric" value="${fmtIn(s.amount)}" data-k="amount" oninput="this.value=fmtIn(num(this.value))"></div>
      <div class="lbl">${t('lines')}</div>`+
      (s.lines||[]).map((l,li)=>`<div class="line"><select data-l="${li}" data-f="env">${envOptions(l.env)}</select><input inputmode="numeric" data-l="${li}" data-f="amount" value="${fmtIn(l.amount)}" oninput="this.value=fmtIn(num(this.value))"><button class="btn ghost sm" onclick="salLine(${si},'del',${li})">✕</button></div>`).join('')+
      `<button class="btn ghost sm" onclick="salLine(${si},'add')">${t('addLine')}</button>
      <div class="sum"><span>${t('total')} / ${t('remaining')}</span><span>${fmt(tot)} / ${fmt(num(s.amount)-tot)}</span></div>
      <button class="btn sm" style="background:${SC.sal}" onclick="salSave(${si})">${t('save')}</button></div>`;
  });
  h+=sec('💼 '+t('salaries'),SC.sal,sal);
  // additional income rule + saving split
  const R=S.irregular||{};
  const gOpt=(sel,kindGoal)=>`<option value="">${t('none')}</option>`+acts(D.goals).filter(g=>!kindGoal||g.kind==='goal').map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(em(g)+' '+nm(g))}</option>`).join('');
  h+=sec('💰 '+t('irregRule'),SC.irr,`<div class="card"><div class="muted" style="margin-bottom:8px">${esc(irregText())}</div><div class="edS">
    <div><label class="muted">${t('threshold')}</label><input id="irTh" inputmode="numeric" value="${fmtIn(R.threshold)}" oninput="this.value=fmtIn(num(this.value))"></div>
    <div><label class="muted">${t('savingsPct')}</label><input id="irPct" type="number" min="0" max="100" value="${num(R.savingsPct)}"></div></div>
    <div class="lbl" style="margin-top:8px">${t('personalCats')}</div><div class="chips" style="margin-bottom:8px">${cats().map(c=>`<label class="check" style="margin:2px 6px 2px 0;font-size:13px"><input type="checkbox" class="irP" value="${c.id}" ${(R.personal||[]).includes(c.id)?'checked':''}> ${esc(em(c)+' '+nm(c))}</label>`).join('')}</div>
    <div class="f"><label>${t('remainderGoal')}</label><select id="irRem">${gOpt(R.remainderGoal||'land',true)}</select></div>
    <div class="lbl">🎯 ${t('saving')} — ${t('shareHow')}</div><div class="pick" data-pick="savMode">${['equal','need'].map(m=>`<button type="button" class="${(S.savingMode||'equal')===m?'on':''}" data-v="${m}" onclick="pickOne(this)">${m==='equal'?'⚖️ '+t('equalParts'):'📈 '+t('byNeed')}</button>`).join('')}</div>
    <button class="btn sm" style="background:${SC.irr}" onclick="irSave()">${t('save')}</button></div>`);
  // funds
  funds().forEach((f,fi)=>{
    let inner=`<div class="card"><div class="edS"><input value="${esc(f.emoji)}" id="fE${fi}" style="max-width:60px;text-align:center"><input value="${esc(f.name_fr)}" id="fF${fi}" placeholder="${t('nameFr')}"></div>
      <div class="edS" style="margin-top:6px"><input value="${esc(f.name_en)}" id="fN${fi}" placeholder="${t('nameEn')}"><input type="color" value="${esc(f.color)}" id="fC${fi}" style="height:36px;padding:2px"></div>
      <button class="btn sm" style="margin-top:8px;background:${f.color}" onclick="fundSave(${fi})">${t('save')}</button></div>`;
    if(f.cats){
      inner+=`<div class="lbl">${t('fundCats')}</div><div class="igrid">`+D.categories.filter(c=>c.fund===f.id).sort(byOrder).map(c=>edItem('Categories',c)).join('')+
        `<button class="additem" onclick="addItem('Categories','${f.id}')">+ ${t('add')}</button></div>`;
      const plan=((S.fundIncome||{})[f.id]||{}).lines||[], tot=plan.reduce((a,l)=>a+num(l.amount),0);
      inner+=`<div class="card" id="fplan_${f.id}" style="margin-top:10px"><b>${t('fundIncomeS')}</b>`+
        plan.map((l,li)=>`<div class="line"><span class="lab">${esc(envName(l.env))}</span><input inputmode="numeric" data-l="${li}" value="${fmtIn(l.amount)}" oninput="this.value=fmtIn(num(this.value))"></div>`).join('')+
        `<div class="sum"><span>${t('total')}</span><span>${fmt(tot)}</span></div><button class="btn sm" style="background:${f.color}" onclick="planSave('${f.id}')">${t('save')}</button></div>`;
    }
    h+=sec(esc(em(f)+' '+nm(f)),f.color,inner);
  });
  // rollover
  const RO=S.rollover||{sources:[],targets:[]};
  h+=sec('🔁 '+t('rolloverRule'),SC.roll,`<div class="card"><div class="lbl">${t('sources')}</div><div style="margin:0 0 8px">`+
    acts(D.goals).map(g=>`<label class="check" style="display:inline-flex;margin:2px 10px 2px 0;font-size:13px"><input type="checkbox" class="roS" value="${g.id}" ${(RO.sources||[]).includes(g.id)?'checked':''}> ${esc(em(g)+' '+nm(g))}</label>`).join('')+`</div>
    <div class="lbl">${t('targets')}</div>`+
    (RO.targets||[]).map(tg=>`<div class="edS roT" style="margin-bottom:6px"><select class="roG" style="border:1px solid var(--line);border-radius:9px;padding:7px">${gOpt(tg.goal)}</select><input class="roP" type="number" value="${num(tg.pct)}" placeholder="%">
      <div style="grid-column:1/-1"><label class="muted">${t('fallback')}</label><select class="roF" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:7px">${gOpt(tg.fallback)}</select></div></div>`).join('')+
    `<button class="btn ghost sm" onclick="roAdd()">${t('addLine')}</button> <button class="btn sm" style="background:${SC.roll}" onclick="roSave()">${t('save')}</button></div>`);
  // appearance + backup
  h+=sec('🎨 '+t('appearance'),SC.app,`<div class="card"><div class="lbl">${t('lang')}</div><div class="chips" style="margin-bottom:10px"><button class="${LANG==='fr'?'on':''}" onclick="LANG='fr';lsSet('bt_lang','fr');render()">Français</button><button class="${LANG==='en'?'on':''}" onclick="LANG='en';lsSet('bt_lang','en');render()">English</button></div>
    <div class="lbl">${t('bgS')}</div><div class="bgprev"></div>
    <label class="btn sm" style="display:inline-block;background:${SC.app}">${t('bgChoose')}<input type="file" accept="image/*" style="display:none" onchange="pickBg(this)"></label>
    <button class="btn ghost sm" onclick="resetBg()">${t('bgReset')}</button></div>`);
  h+=sec('💾 '+t('backup'),SC.bak,`<div class="card"><button class="btn sm sec" onclick="exportBackup()">⬇ ${t('exportB')}</button>
    <label class="btn sm sec" style="display:inline-block">⬆ ${t('importB')}<input type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></label></div>`);
  return h;
}
/** Is this account / category / goal used anywhere? (then it can only be hidden, not deleted) */
function isUsed(table,id){
  const S=D.settings, key=(table==='Categories'?'c:':'g:')+id;
  if(table==='Accounts') return D.ledger.some(r=>r.acc===id||r.acc2===id)||(S.salaries||[]).some(s=>s.account===id)||(S.irregular||{}).account===id||S.savAccount===id;
  if(D.ledger.some(r=>r.env===key||r.env2===key)) return true;
  if((S.salaries||[]).some(s=>(s.lines||[]).some(l=>l.env===key))) return true;
  if(table==='Categories') return (S.irregular||{}).personal&&S.irregular.personal.includes(id)||D.accounts.some(a=>a.spend===id);
  return (S.irregular||{}).remainderGoal===id||(S.rollover||{}).sources&&S.rollover.sources.includes(id)||((S.rollover||{}).targets||[]).some(x=>x.goal===id||x.fallback===id);
}
function edItem(table,o){
  const off=!isTrue(o.active), used=isUsed(table,o.id), fresh=String(o.id).startsWith('x')&&!used;
  let x=`<div class="item ${off?'off':''}" data-table="${table}" data-id="${esc(o.id)}" ${o.fund&&table==='Categories'?`style="--c:${fundColor(o.fund)}"`:''}>
    <div class="r"><input class="emo" data-k="emoji" value="${esc(o.emoji)}" maxlength="4"><input data-k="name_fr" value="${esc(o.name_fr)}" placeholder="${t('nameFr')}"></div>
    <input data-k="name_en" value="${esc(o.name_en)}" placeholder="${t('nameEn')}">`;
  if(table==='Goals'){
    x+=`<div class="lb">${t('target')}</div><input data-k="target" inputmode="numeric" value="${fmtIn(o.target)}" oninput="this.value=fmtIn(num(this.value))">
      <div class="lb">${t('deadline')}</div><input data-k="deadline" type="date" value="${esc(o.deadline)}">
      <select data-k="kind"><option value="goal" ${o.kind==='goal'?'selected':''}>${t('kGoal')}</option><option value="reserve" ${o.kind==='reserve'?'selected':''}>${t('kRes')}</option></select>
      <label class="ck"><input type="checkbox" data-k="yearly" ${isTrue(o.yearly)?'checked':''}> ${t('yearly')}</label>`;
  }
  if(table==='Accounts'){
    const tag=o.fund?fundName(o.fund):isTrue(o.savings)?'🎯 '+t('savWallet'):o.spend?'🛒 → '+envName('c:'+o.spend):'';
    if(tag&&!fresh) x+=`<div class="lb">${esc(tag)}</div>`;
    // the amount of a wallet is set with "Adjust balance" (dated entry in its history), not an opening balance
    if(!fresh&&!o.spend) x+=`<button class="btn sm sec" onclick="openWallet('${o.id}')">🔧 ${t('adjust')}</button>`;
    if(fresh) x+=`<label class="ck"><input type="checkbox" data-k="savings" ${isTrue(o.savings)?'checked':''}> ${t('isSavAcc')}</label>
      <div class="lb">${t('belongsTo')}</div><select data-k="fund">${[''].concat(funds().map(f=>f.id)).map(f=>`<option value="${f}" ${(o.fund||'')===f?'selected':''}>${esc(fundName(f))}</option>`).join('')}</select>`;
  }
  x+=`<div class="acts"><button class="btn sm" style="background:var(--c)" onclick="edSave(this)">${t('save')}</button>
    ${used?`<button class="btn sm sec" onclick="toggleItem(this)">${off?t('showIt'):t('hide')}</button>`:`<button class="btn sm danger" onclick="delItem(this)">${t('del')}</button>`}</div></div>`;
  return x;
}
function edSave(btn){
  const box=btn.closest('.item'), table=box.dataset.table, list=D[table.toLowerCase()];
  const o=Object.assign({},list.find(x=>x.id===box.dataset.id));
  box.querySelectorAll('[data-k]').forEach(i=>{ const k=i.dataset.k; o[k]=i.type==='checkbox'?i.checked:(['target','opening'].includes(k)?num(i.value):i.value); });
  if(o.fund) o.savings=false;
  list[list.findIndex(x=>x.id===o.id)]=o;
  call('apiUpsert',table,o); toast(t('saved')); render();
}
function toggleItem(btn){
  const box=btn.closest('.item'), table=box.dataset.table, list=D[table.toLowerCase()], o=list.find(x=>x.id===box.dataset.id);
  o.active=!isTrue(o.active); call('apiUpsert',table,o); render();
}
function delItem(btn){
  if(!btn.dataset.sure){ btn.dataset.sure='1'; btn.textContent=t('sure'); return; }
  const box=btn.closest('.item'), table=box.dataset.table, key=table.toLowerCase(), id=box.dataset.id;
  if(isUsed(table,id)) return;
  D[key]=D[key].filter(x=>x.id!==id);
  const F=D.settings.fundIncome||{}; Object.keys(F).forEach(k=>{ F[k].lines=(F[k].lines||[]).filter(l=>l.env!=='c:'+id); });
  call('apiDeleteItem',table,id); call('apiSetSetting','fundIncome',F);
  toast(t('delOk')); render();
}
function addItem(table,fund){
  const list=D[table.toLowerCase()];
  const o={id:'x'+uid(),name_fr:'',name_en:'',active:true,order:list.length+1,emoji:''};
  if(table==='Goals') Object.assign(o,{kind:'goal',target:0,deadline:'',yearly:false});
  if(table==='Accounts') Object.assign(o,{opening:0,spend:'',savings:false,fund:''});
  if(table==='Categories'){ o.fund=fund||''; if(fund){ const F=D.settings.fundIncome=D.settings.fundIncome||{}; (F[fund]=F[fund]||{lines:[]}).lines.push({env:'c:'+o.id,amount:0}); } }
  list.push(o); render();
  setTimeout(()=>{ const el=document.querySelector(`.item[data-id="${o.id}"] input[data-k="name_fr"]`); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } },50);
}
function fundSave(fi){
  const f=D.settings.funds[fi];
  f.emoji=$('fE'+fi).value; f.name_fr=$('fF'+fi).value; f.name_en=$('fN'+fi).value; f.color=$('fC'+fi).value;
  call('apiSetSetting','funds',D.settings.funds); toast(t('saved')); render();
}
function planSave(fund){
  const F=D.settings.fundIncome=D.settings.fundIncome||{}, lines=(F[fund]=F[fund]||{lines:[]}).lines, grp=uid(), rows=[];
  document.querySelectorAll(`#fplan_${fund} [data-l]`).forEach(i=>{ const l=lines[+i.dataset.l], d=num(i.value)-num(l.amount);
    if(d) rows.push(row({type:'budget',amount:d,env:l.env,grp,fund,note:t('fundIncomeS')})); l.amount=num(i.value); });
  call('apiSetSetting','fundIncome',F);
  if(rows.length) commit(rows); else { toast(t('saved')); render(); }
}
function salCollect(si){
  const s=D.settings.salaries[si], box=$('sal'+si);
  box.querySelectorAll('[data-k]').forEach(i=>{ s[i.dataset.k]=i.dataset.k==='amount'?num(i.value):i.value; });

  box.querySelectorAll('[data-l]').forEach(i=>{ const l=s.lines[+i.dataset.l]; l[i.dataset.f]=i.dataset.f==='amount'?num(i.value):i.value; });
}
function salLine(si,act,li){ salCollect(si); const s=D.settings.salaries[si]; if(act==='add') s.lines.push({env:'c:food',amount:0}); else s.lines.splice(li,1); render(); }
function salSave(si){ salCollect(si); call('apiSetSetting','salaries',D.settings.salaries).then(()=>{toast(t('saved'));render();}).catch(e=>toast(t('error')+': '+e)); }
function irSave(){
  D.settings.irregular={threshold:num($('irTh').value),savingsPct:num($('irPct').value),
    personal:[...document.querySelectorAll('.irP:checked')].map(i=>i.value),remainderGoal:$('irRem').value||'land'};
  D.settings.savingMode=pickVal('savMode')||'equal'; call('apiSetSetting','savingMode',D.settings.savingMode);
  call('apiSetSetting','irregular',D.settings.irregular).then(()=>{toast(t('saved'));render();}).catch(e=>toast(t('error')+': '+e));
}
function roCollect(){
  return {sources:[...document.querySelectorAll('.roS:checked')].map(i=>i.value),
    targets:[...document.querySelectorAll('.roT')].map(b=>({goal:b.querySelector('.roG').value,pct:num(b.querySelector('.roP').value),fallback:b.querySelector('.roF').value}))};
}
function roAdd(){ const r=roCollect(); r.targets.push({goal:'',pct:0,fallback:''}); D.settings.rollover=r; render(); }
function roSave(){ const r=roCollect(); r.targets=r.targets.filter(x=>x.goal); D.settings.rollover=r; call('apiSetSetting','rollover',r).then(()=>{toast(t('saved'));render();}).catch(e=>toast(t('error')+': '+e)); }

/* ----- background image (default bg.svg, or your own photo stored on this device) ----- */
function applyBg(){ const u=lsGet('bt_bg'); document.documentElement.style.setProperty('--bgimg',u?`url("${u}")`:'url(bg.svg)'); }
function pickBg(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{ const k=Math.min(1,1400/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      try{ localStorage.setItem('bt_bg',c.toDataURL('image/jpeg',0.8)); }catch(e){ toast(t('error')); } applyBg(); render(); };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}
function resetBg(){ try{ localStorage.removeItem('bt_bg'); }catch(e){} applyBg(); render(); }

/* ----- sync settings ----- */
function syncStateHtml(){
  const n=OUTBOX.length;
  return `<div class="row"><div class="grow"><b>${CONN?'☁ '+t('connected'):'📱 '+t('notConnected')}</b>
    <div class="muted">${t('lastSync')}: ${SYNC.last?new Date(SYNC.last).toLocaleString(LANG==='en'?'en-GB':'fr-FR'):t('never')}${n?' · '+n+' '+t('pending'):''}</div>
    ${SYNC.err?`<div class="err">⚠️ ${esc(SYNC.err)}</div>`:''}</div>
    ${CONN?`<button class="btn sm" onclick="pull()">${t('syncNow')}</button>`:''}</div>`;
}
function connectSheet(){
  const url=$('cUrl').value.trim(), token=$('cTok').value.trim(); if(!url||!token) return;
  const prev=CONN; CONN={url,token}; $('cMsg').textContent=t('connecting');
  remote('apiGetAll',[]).then(()=>{ lsSet(LS_CONN,JSON.stringify(CONN)); SYNC.err=''; toast(t('connOk')); return pull(); })
    .then(()=>render())
    .catch(e=>{ CONN=prev; $('cMsg').textContent='⚠️ '+(String(e.message||e)==='AUTH'?t('authErr'):(e.message||e)); });
}
function copyConnLink(){
  const link=location.origin+location.pathname+'#connect='+btoa(JSON.stringify(CONN));
  (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast(t('linkCopied'))).catch(()=>prompt(t('copyLink'),link));
}
/** Opening the app with #connect=… (link copied on another device) connects it to the Sheet automatically. */
function connectFromLink(){
  const m=location.hash.match(/#connect=([^&]+)/); if(!m) return;
  try{ const c=JSON.parse(atob(decodeURIComponent(m[1]))); if(c.url&&c.token){ CONN=c; lsSet(LS_CONN,JSON.stringify(CONN)); toast(t('connOk')); } }catch(e){}
  history.replaceState({v:'home'},'',location.pathname);
}
function disconnectSheet(){ CONN=null; try{ localStorage.removeItem(LS_CONN); }catch(e){} render(); updSync(); }
function exportBackup(){
  const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='budget-backup-'+today()+'.json'; a.click();
}
function importBackup(input){
  const f=input.files&&input.files[0]; if(!f) return;
  f.text().then(txt=>{ const d=JSON.parse(txt); if(!d.ledger||!d.settings) throw new Error('format');
    D=normalise(d); saveCache(); toast(t('importOk')); render();
  }).catch(e=>toast(t('error')+': '+e.message));
}

/* ----- toast ----- */
let toastT=null;
function toast(msg,undo){
  const el=$('toast'); $('toastMsg').textContent=msg;
  const b=$('toastBtn'); b.style.display=undo?'inline':'none'; b.textContent=t('undo'); b.onclick=()=>{ el.style.display='none'; undo(); };
  el.style.display='flex'; clearTimeout(toastT); toastT=setTimeout(()=>el.style.display='none',undo?5000:2500);
}

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
applyBg();
history.replaceState({v:'home'},'');
connectFromLink();
load();
</script>
